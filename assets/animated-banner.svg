<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Vikas Rana — AI, Python, and automation</title>
  <desc id="description">A vivid animated neon banner with a glowing network, orbiting light, and colorful gradients.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080d1b" />
      <stop offset="52%" stop-color="#111936" />
      <stop offset="100%" stop-color="#251044" />
      <animate attributeName="x2" values="1;0;1" dur="12s" repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="52%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#a855f7" stop-opacity=".32" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#94a3b8" stroke-opacity=".07" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="26" fill="url(#background)" />
  <rect width="1200" height="320" rx="26" fill="url(#grid)" />
  <circle cx="1000" cy="150" r="210" fill="url(#halo)">
    <animate attributeName="r" values="190;230;190" dur="7s" repeatCount="indefinite" />
  </circle>
  <g fill="none" stroke="url(#neon)" stroke-width="1.5" opacity=".55">
    <path d="M740 45 855 105 985 48 1100 105 1160 55M740 45 775 175 900 245 1025 175 1160 245M855 105 900 245M985 48 1025 175 1100 105 1160 245" />
    <path d="M740 45 855 105 985 48 1100 105 1160 55" stroke-dasharray="7 12">
      <animate attributeName="stroke-dashoffset" values="0;76" dur="5s" repeatCount="indefinite" />
    </path>
  </g>
  <g fill="#67e8f9" filter="url(#glow)">
    <circle cx="740" cy="45" r="4"><animate attributeName="r" values="3;7;3" dur="3s" repeatCount="indefinite" /></circle>
    <circle cx="855" cy="105" r="5"><animate attributeName="r" values="4;8;4" dur="3.8s" repeatCount="indefinite" /></circle>
    <circle cx="985" cy="48" r="4"><animate attributeName="r" values="3;7;3" dur="4.2s" repeatCount="indefinite" /></circle>
    <circle cx="1100" cy="105" r="5"><animate attributeName="r" values="4;8;4" dur="3.5s" repeatCount="indefinite" /></circle>
    <circle cx="775" cy="175" r="4"><animate attributeName="r" values="3;7;3" dur="4s" repeatCount="indefinite" /></circle>
    <circle cx="900" cy="245" r="5"><animate attributeName="r" values="4;8;4" dur="3.2s" repeatCount="indefinite" /></circle>
    <circle cx="1025" cy="175" r="4"><animate attributeName="r" values="3;7;3" dur="4.4s" repeatCount="indefinite" /></circle>
    <circle cx="1160" cy="245" r="5"><animate attributeName="r" values="4;8;4" dur="3.6s" repeatCount="indefinite" /></circle>
  </g>
  <ellipse cx="950" cy="155" rx="205" ry="102" fill="none" stroke="#c084fc" stroke-opacity=".3" stroke-width="1.5" transform="rotate(-22 950 155)" />
  <circle r="6" fill="#f0abfc" filter="url(#glow)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M740 45 855 105 985 48 1100 105 1160 245 1025 175 900 245 775 175 740 45" />
  </circle>
  <text x="78" y="112" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="1">VIKAS RANA</text>
  <rect x="80" y="136" width="290" height="3" rx="2" fill="url(#neon)" />
  <text x="80" y="183" fill="#c4b5fd" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" letter-spacing="2">AI / ML  ·  PYTHON  ·  AUTOMATION</text>
  <text x="80" y="224" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="16">Building useful software, one idea at a time.</text>
  <text x="80" y="272" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="3">THINK  ·  BUILD  ·  ITERATE</text>
  <rect x="0" y="0" width="1200" height="320" rx="26" fill="none" stroke="url(#neon)" stroke-opacity=".42" stroke-width="2" />
</svg>
